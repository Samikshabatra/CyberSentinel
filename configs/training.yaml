# QLoRA fine-tuning configuration (default GPU profile).
# Targets a consumer NVIDIA GPU with roughly 12-16 GB of memory.
# For a smaller card, run: python scripts/train.py --low-memory

base_model_name: Qwen/Qwen2.5-3B-Instruct
output_dir: models/cybersentinel-lora
max_seq_length: 1024

train_file: data/train/train_chat.jsonl
validation_file: data/validation/validation_chat.jsonl

# Effective batch size = per_device_train_batch_size * gradient_accumulation_steps = 16
learning_rate: 0.0002
num_train_epochs: 3.0
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
warmup_ratio: 0.03
weight_decay: 0.01
lr_scheduler_type: cosine
max_grad_norm: 0.3
optim: paged_adamw_8bit
seed: 20260808

gradient_checkpointing: true
bf16: true
fp16: false

logging_steps: 10
eval_strategy: epoch
save_strategy: epoch
save_total_limit: 2
load_best_model_at_end: true
metric_for_best_model: eval_loss
report_to: none

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

quantization:
  load_in_4bit: true
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16
