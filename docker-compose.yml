# Local service stack for CyberSentinel.
#
#   docker compose up -d qdrant postgres     # services only (recommended for dev)
#   docker compose up -d                     # services plus API and UI
#
# After the services are up, build the knowledge base:
#   python scripts/ingest_knowledge_base.py
#
# The application also runs with no services at all: it falls back to a local
# vector store and SQLite. Docker gives the production-shaped path.

name: cybersentinel

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cybersentinel-qdrant
    restart: unless-stopped
    ports:
      # Host ports are offset from the Qdrant defaults so this stack can run
      # alongside another project already using 6333/6334. Docker does not fail
      # loudly on a taken port in every configuration - it can silently leave the
      # container unpublished, and the client then talks to the *other* service.
      - "${QDRANT_HOST_PORT:-6353}:6333"   # REST
      - "${QDRANT_GRPC_HOST_PORT:-6354}:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The Qdrant image has no curl; use the Python already present.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: cybersentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cybersentinel}
      # Development default only. Override POSTGRES_PASSWORD in .env for any
      # deployment that is reachable by anyone else.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cybersentinel}
      POSTGRES_DB: ${POSTGRES_DB:-cybersentinel}
    ports:
      # Offset from 5432 for the same reason as Qdrant above.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cybersentinel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api
    container_name: cybersentinel-api
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cybersentinel}:${POSTGRES_PASSWORD:-cybersentinel}@postgres:5432/${POSTGRES_DB:-cybersentinel}
      # Pinned, not inherited from the host .env. This image installs the [ui,eval]
      # extras only - no torch, no CUDA - so the 'hf' backend cannot run here and
      # would degrade every analysis to Unknown. Model-backed inference runs on the
      # host (see docs/fine_tuning.md); the container serves the deterministic path.
      LLM_BACKEND: mock
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-development}
    ports:
      - "8000:8000"
    volumes:
      # Mount a trained adapter to serve the fine-tuned model.
      - ./models:/app/models:ro
    profiles: ["full"]

  ui:
    build:
      context: .
      target: ui
    container_name: cybersentinel-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000
      QDRANT_URL: http://qdrant:6333
      # Pinned for the same reason as the api service above.
      LLM_BACKEND: mock
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-hash}
    ports:
      - "8501:8501"
    profiles: ["full"]

volumes:
  qdrant_storage:
  pgdata:
