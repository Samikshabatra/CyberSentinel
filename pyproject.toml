[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentinel"
version = "0.1.0"
description = "CyberSentinel: An Agentic LLM Framework for Cybersecurity Threat Detection, Intelligence Retrieval and Incident Response"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CyberSentinel Project" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "langgraph>=0.2.28",
    "langchain-core>=0.3.0",
    "qdrant-client>=1.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Heavy ML stack: only needed for fine-tuning / local model inference.
ml = [
    "torch>=2.3",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.9",
    "accelerate>=0.33",
    "datasets>=2.20",
    # 0.45+ ships official Windows wheels; earlier releases were Linux-only.
    "bitsandbytes>=0.45",
    "sentence-transformers>=3.0",
]
ui = [
    "streamlit>=1.37",
    "pandas>=2.2",
    "plotly>=5.22",
]
eval = [
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cybersentinel-api = "cybersentinel.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `Depends(...)` in a parameter default is the documented FastAPI idiom for
# dependency injection; B008 does not apply.
"src/cybersentinel/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
